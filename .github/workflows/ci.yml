name: Build and test

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and test on Unix
        if: runner.os != 'Windows'
        run: bash ci.sh
      - name: Build and test on Windows
        if: runner.os == 'Windows'
        run: .\ci.bat
      - uses: actions/upload-artifact@v4
        with:
          name: hello-${{ matrix.os }}
          path: |
            .venv/bin/hello
            .venv/Scripts/hello.exe
